<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Spitiko</title>
<meta name="theme-color" content="#4F6B3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spitiko">
<meta name="application-name" content="Spitiko">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F5EE; --card:#FFFFFF; --ink:#16221B; --sub:#7E8C77;
  --olive:#4F6B3E; --soft:#E3EBDB; --lemon:#F2C230;
  --hair:#DCE3D5; --strike:#A6B29E;
  --shadow:0 1px 0 rgba(22,34,27,.04), 0 6px 16px -12px rgba(22,34,27,.35);
}
body.dark{
  --paper:#11150F; --card:#1A1F16; --ink:#EAEFE4; --sub:#8A9682;
  --olive:#9CC47A; --soft:#242C1E; --lemon:#E8C04A;
  --hair:#2A3222; --strike:#5C6653;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 6px 16px -12px rgba(0,0,0,.8);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper); color:var(--ink);
  font-family:Inter,system-ui,sans-serif; font-size:16px;
  overscroll-behavior-y:none; transition:background .2s ease,color .2s ease;
  padding-bottom:calc(88px + env(safe-area-inset-bottom));
}
button,input,select{font-family:inherit;color:inherit;}
button{border:none;background:none;cursor:pointer;}

header{position:sticky;top:0;z-index:20;background:var(--paper);
  padding:calc(13px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--hair);}
.brand{display:flex;align-items:center;gap:9px;}
.brand h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:25px;
  letter-spacing:-.5px;margin:0;flex:1;line-height:1.1;}
.brand h1 em{display:block;font-style:normal;font-size:11px;font-weight:600;color:var(--sub);letter-spacing:.3px;margin-top:1px;}
.iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--hair);background:var(--card);
  display:flex;align-items:center;justify-content:center;flex:none;}
.iconbtn:active{background:var(--soft);}
.toolrow{display:flex;gap:8px;margin-top:10px;}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);
  border:1px solid var(--hair);border-radius:11px;padding:0 12px;}
.search input{border:none;outline:none;background:none;width:100%;font-size:15px;padding:11px 0;}
.ghost{background:var(--card);border:1px solid var(--hair);border-radius:11px;
  padding:9px 13px;font-size:13px;font-weight:600;white-space:nowrap;}
.ghost:active{background:var(--soft);}
.ghost.warn{color:#C4553D;}
main{padding:14px 16px 10px;max-width:700px;margin:0 auto;}

.cat{margin-bottom:8px;}
.cathead{width:100%;display:flex;align-items:center;gap:10px;padding:11px 2px;text-align:left;}
.cathead .idx{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:var(--olive);min-width:22px;}
.cathead h2{font-family:'Bricolage Grotesque',sans-serif;font-size:16px;font-weight:600;margin:0;flex:1;letter-spacing:-.2px;}
.cathead h2 em{font-style:normal;font-weight:400;font-size:11px;color:var(--sub);display:block;}
.cathead .n{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--sub);}
.chev{transition:transform .18s ease;opacity:.5;}
.cat.open .chev{transform:rotate(90deg);}
.items{display:none;} .cat.open .items{display:block;}

.row{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--hair);
  border-radius:12px;padding:10px 12px;margin-bottom:6px;box-shadow:var(--shadow);}
.nm{flex:1;font-size:15px;line-height:1.25;min-width:0;}
.nm em{display:block;font-style:normal;font-size:11px;color:var(--sub);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.qty{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:var(--olive);
  background:var(--soft);padding:4px 7px;border-radius:6px;min-width:30px;text-align:center;}
.plus{flex:none;width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--paper);
  font-size:21px;line-height:1;display:flex;align-items:center;justify-content:center;
  transition:transform .1s ease,background .1s ease;}
.plus:active{transform:scale(.86);}
.plus.hot{background:var(--olive);color:#fff;}
body.dark .plus{color:#11150F;}

.progress{display:flex;align-items:center;gap:10px;margin:2px 0 14px;
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--sub);letter-spacing:.5px;}
.bar{flex:1;height:3px;background:var(--hair);border-radius:2px;overflow:hidden;}
.bar i{display:block;height:100%;background:var(--lemon);transition:width .25s ease;}
.grp{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:1.3px;
  text-transform:uppercase;color:var(--sub);margin:15px 0 7px;display:flex;align-items:center;gap:8px;}
.grp:after{content:"";flex:1;border-top:1px dashed var(--hair);}
.lrow{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--hair);
  border-radius:12px;padding:11px 12px;margin-bottom:6px;box-shadow:var(--shadow);}
.tick{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--strike);
  display:flex;align-items:center;justify-content:center;transition:all .15s ease;}
.tick svg{opacity:0;transform:scale(.5);transition:all .15s ease;}
.lrow.done .tick{background:var(--olive);border-color:var(--olive);}
.lrow.done .tick svg{opacity:1;transform:scale(1);}
.lrow.done{opacity:.5;}
.lrow.done .nm{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--olive);color:var(--strike);}
.lrow.done .nm em{text-decoration:line-through;}
.meta{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--olive);
  background:var(--soft);padding:2px 5px;border-radius:4px;margin-left:6px;}
.step{display:flex;align-items:center;border:1px solid var(--hair);border-radius:9px;overflow:hidden;flex:none;}
.step button{width:30px;height:30px;font-size:17px;line-height:1;color:var(--sub);}
.step button:active{background:var(--soft);}
.step .v{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;min-width:22px;text-align:center;}

.card{background:var(--card);border:1px solid var(--hair);border-radius:14px;
  padding:14px;margin-bottom:10px;box-shadow:var(--shadow);}
.card h3{font-family:'Bricolage Grotesque',sans-serif;font-size:17px;margin:0 0 2px;font-weight:600;}
.card h3 em{font-style:normal;font-size:11px;color:var(--sub);font-weight:400;display:block;}
.card p{margin:6px 0 12px;font-size:13px;color:var(--sub);line-height:1.45;}
.cardbtns{display:flex;gap:8px;}
.cardbtns .ghost{flex:1;text-align:center;}
.primary{background:var(--ink);color:var(--paper);border:1px solid var(--ink);}
body.dark .primary{color:#11150F;}

.setrow{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--card);
  border:1px solid var(--hair);border-radius:12px;margin-bottom:6px;box-shadow:var(--shadow);}
.setrow .sl{flex:1;font-size:15px;}
.setrow .sl em{display:block;font-style:normal;font-size:11px;color:var(--sub);margin-top:2px;line-height:1.35;}
.sw{width:46px;height:27px;border-radius:14px;background:var(--hair);position:relative;flex:none;transition:background .18s ease;}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;
  background:#fff;transition:transform .18s ease;box-shadow:0 1px 3px rgba(0,0,0,.25);}
.sw.on{background:var(--olive);}
.sw.on:after{transform:translateX(19px);}
.seg{display:flex;border:1px solid var(--hair);border-radius:10px;overflow:hidden;flex:none;}
.seg button{padding:7px 13px;font-size:13px;font-weight:600;color:var(--sub);}
.seg button.on{background:var(--olive);color:#fff;}
.sechead{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:1.3px;
  text-transform:uppercase;color:var(--sub);margin:20px 0 8px;}

.empty{text-align:center;padding:46px 18px;}
.empty h3{font-family:'Bricolage Grotesque',sans-serif;font-size:19px;margin:0 0 6px;}
.empty p{color:var(--sub);font-size:14px;margin:0 0 20px;line-height:1.5;}
.big{display:block;width:100%;background:var(--ink);color:var(--paper);padding:15px;
  border-radius:13px;font-size:15px;font-weight:600;text-align:center;}
body.dark .big{color:#11150F;}
.big.alt{background:var(--card);color:var(--ink);border:1px solid var(--hair);margin-top:8px;}

.rrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--hair);
  border-radius:12px;padding:0 12px;height:52px;margin-bottom:6px;box-shadow:var(--shadow);
  touch-action:pan-y;user-select:none;position:relative;}
.cblock{margin-bottom:6px;transition:transform .16s ease;}
.cblock.drag{z-index:6;position:relative;transition:none;}
.cblock .rrow{margin-bottom:0;}
.xbtn{width:26px;height:26px;border-radius:8px;border:1px solid var(--hair);color:var(--sub);
  font-size:16px;line-height:1;flex:none;display:flex;align-items:center;justify-content:center;}
.xbtn:active{background:var(--soft);}
.rsub{border:1px solid var(--hair);border-top:none;border-radius:0 0 12px 12px;
  background:var(--card);padding:4px 12px 10px;}
.srow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--hair);}
.srow:last-of-type{border-bottom:none;}
.srow .nm{font-size:14px;}
.pen{width:28px;height:28px;border-radius:8px;border:1px solid var(--hair);color:var(--sub);
  flex:none;display:flex;align-items:center;justify-content:center;}
.pen:active{background:var(--soft);}
.srow .nm{cursor:pointer;}
.minus{width:28px;height:28px;border-radius:8px;border:1px solid var(--hair);color:#C4553D;
  font-size:17px;line-height:1;flex:none;}
.minus:active{background:var(--soft);}
.addrow{width:100%;padding:10px;margin-top:6px;border:1px dashed var(--hair);border-radius:10px;
  font-size:13px;font-weight:600;color:var(--olive);}
.addrow:active{background:var(--soft);}
.rrow.drag{z-index:5;box-shadow:0 10px 24px -8px rgba(0,0,0,.4);border-color:var(--olive);}
.rrow .hnd{opacity:.4;flex:none;touch-action:none;padding:8px 2px;margin:-8px 0;}
.rn .cn{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;
  color:var(--sub);background:var(--soft);padding:2px 5px;border-radius:4px;margin-left:4px;}
.rrow .rn{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rrow .num{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--sub);}

nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);
  border-top:1px solid var(--hair);padding-bottom:env(safe-area-inset-bottom);}
nav button{flex:1;padding:11px 0 13px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--sub);position:relative;}
nav button.on{color:var(--ink);}
nav button.on:before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:32px;height:3px;background:var(--lemon);border-radius:0 0 3px 3px;}
nav .lbl{font-size:9.5px;font-weight:600;}
nav button{padding:10px 0 12px;}
nav svg{stroke-width:1.6;}
.badge{position:absolute;top:5px;left:calc(50% + 9px);font-family:'JetBrains Mono',monospace;
  font-size:9px;font-weight:700;background:var(--olive);color:#fff;border-radius:9px;padding:2px 5px;min-width:16px;text-align:center;}

#veil{position:fixed;inset:0;background:rgba(10,14,9,.5);z-index:40;opacity:0;pointer-events:none;
  transition:opacity .2s ease;backdrop-filter:blur(2px);}
#veil.show{opacity:1;pointer-events:auto;}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--paper);
  border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(105%);transition:transform .26s cubic-bezier(.3,.9,.3,1);max-height:88vh;overflow:auto;}
#sheet.show{transform:none;}
#sheet h3{font-family:'Bricolage Grotesque',sans-serif;font-size:19px;margin:0 0 3px;font-weight:600;}
#sheet .sub{font-size:12px;color:var(--sub);margin:0 0 16px;}
.fld{margin-bottom:12px;}
.fld label{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;
  letter-spacing:1.1px;text-transform:uppercase;color:var(--sub);margin-bottom:6px;}
.fld input,.fld select,.fld textarea{width:100%;background:var(--card);border:1px solid var(--hair);
  border-radius:11px;padding:12px;font-size:15px;outline:none;-webkit-appearance:none;appearance:none;}
.fld input:focus,.fld select:focus{border-color:var(--olive);}
.two{display:flex;gap:8px;} .two .fld{flex:1;}
.sheetbtns{display:flex;gap:8px;margin-top:6px;}
.sheetbtns button{flex:1;padding:14px;border-radius:12px;font-size:15px;font-weight:600;}
.pickitem{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--hair);}
.pickitem .nm{font-size:14px;}
.box{width:24px;height:24px;border-radius:7px;border:2px solid var(--strike);flex:none;
  display:flex;align-items:center;justify-content:center;}
.box.on{background:var(--olive);border-color:var(--olive);}
.box svg{opacity:0;} .box.on svg{opacity:1;}
#toast{position:fixed;bottom:calc(98px + env(safe-area-inset-bottom));left:50%;
  transform:translate(-50%,14px);opacity:0;pointer-events:none;background:var(--ink);color:var(--paper);
  padding:9px 15px;border-radius:20px;font-size:13px;font-weight:500;transition:all .2s ease;z-index:50;}
body.dark #toast{color:#11150F;}
#toast.show{opacity:1;transform:translate(-50%,0);}
.stats{display:flex;gap:8px;margin-bottom:12px;}
.stat{flex:1;background:var(--card);border:1px solid var(--hair);border-radius:12px;
  padding:12px 10px;text-align:center;box-shadow:var(--shadow);}
.stat b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:18px;font-weight:600;}
.stat em{font-style:normal;font-size:10px;color:var(--sub);letter-spacing:.4px;}
.rcard{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--hair);
  border-radius:12px;padding:10px;margin-bottom:6px;box-shadow:var(--shadow);}
.rcard img{width:44px;height:56px;object-fit:cover;border-radius:8px;flex:none;background:var(--soft);}
.rinfo{flex:1;min-width:0;}
.rinfo b{display:block;font-size:15px;font-weight:600;}
.rinfo span{font-size:11px;color:var(--sub);}
.rtot{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:var(--olive);}
.pm{color:var(--sub)!important;background:none!important;padding:0!important;}
.minus.sm{width:32px;height:32px;}
#imgprev img{width:100%;max-height:230px;object-fit:contain;border-radius:11px;margin-top:8px;background:var(--soft);}
.fld input[type=file]{padding:9px;font-size:13px;}
.fld textarea{font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.6;resize:vertical;}
.miclive{display:flex;align-items:center;justify-content:center;height:96px;
  color:var(--olive);position:relative;margin-bottom:6px;}
.pulse{position:absolute;width:66px;height:66px;border-radius:50%;background:var(--olive);
  opacity:.16;animation:pl 1.5s ease-out infinite;}
@keyframes pl{0%{transform:scale(.75);opacity:.28}100%{transform:scale(1.5);opacity:0}}
.vtxt{background:var(--card);border:1px solid var(--hair);border-radius:11px;padding:11px;
  font-size:15px;margin-bottom:8px;min-height:20px;}
.vres{background:var(--soft);border-radius:10px;padding:9px 11px;margin-bottom:5px;
  font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px;}
.vres em{font-style:normal;font-size:10px;color:var(--sub);margin-left:auto;
  font-family:'JetBrains Mono',monospace;letter-spacing:.4px;}
.vres.nw{background:none;border:1px dashed var(--hair);}
#btnVoice{padding:9px 11px;display:flex;align-items:center;}
.addmini{font-family:Inter,sans-serif;font-size:11px;font-weight:600;color:var(--olive);
  background:var(--soft);padding:3px 9px;border-radius:20px;letter-spacing:0;text-transform:none;}
.addmini:active{opacity:.6;}
.grp:has(.addmini):after{order:-1;}
.notehint{font-size:13px;color:var(--sub);line-height:1.5;padding:2px 2px 8px;}
.hide{display:none!important;}
:focus-visible{outline:2px solid var(--olive);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}

/* ---- added for the Spitiko merge (home-upkeep + sharing) ----
   Deliberately minimal: most of Spitiko's original styling was already a
   close copy of Laiki's own classes (.lrow, .grp, .stat, .sechead, .seg,
   .bar, #sheet, etc.) — those are reused as-is below rather than duplicated.
   Only genuinely new concepts get new classes. */
.statusbadge{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;
  padding:3px 7px;border-radius:20px;flex:none;white-space:nowrap;}
.statusbadge.overdue{background:#F6DED6;color:#C4553D;}
body.dark .statusbadge.overdue{background:#3A2420;}
.statusbadge.soon{background:var(--soft);color:var(--olive);}
.statusbadge.ok{background:var(--hair);color:var(--sub);}
.chipsrow{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;}
.chipsrow::-webkit-scrollbar{display:none;}
.chip{flex:none;padding:7px 13px;border-radius:20px;border:1px solid var(--hair);background:var(--card);
  font-size:12.5px;font-weight:600;color:var(--sub);white-space:nowrap;}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}
body.dark .chip.on{color:#11150F;}
.stat.warn b{color:#C4553D;}
.budgetbar{display:flex;align-items:center;gap:10px;margin:2px 0 14px;
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--sub);letter-spacing:.4px;}
.budgetbar .bar{height:5px;}
.budgetbar .bar i{background:var(--olive);}
.fab{position:fixed;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:25;
  width:50px;height:50px;border-radius:50%;background:var(--ink);color:var(--paper);
  font-size:26px;line-height:1;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 16px -4px rgba(22,34,27,.5);}
body.dark .fab{color:#11150F;}
.fab:active{transform:scale(.92);}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1 id="ttl">Aisles</h1>
    <button class="iconbtn hide" id="btnSearch" data-act="search">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
    </button>
    <button class="iconbtn hide" id="btnAdd" data-act="route">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"><path d="M19.1 13.6a7.6 7.6 0 000-3.2l1.72-1.28a.6.6 0 00.15-.77l-1.63-2.82a.6.6 0 00-.73-.26l-2.02.78a7.7 7.7 0 00-2.77-1.6l-.3-2.14a.6.6 0 00-.6-.51h-3.26a.6.6 0 00-.6.51l-.3 2.14a7.7 7.7 0 00-2.77 1.6l-2.02-.78a.6.6 0 00-.73.26L1.61 8.35a.6.6 0 00.15.77L3.48 10.4a7.6 7.6 0 000 3.2l-1.72 1.28a.6.6 0 00-.15.77l1.63 2.82a.6.6 0 00.73.26l2.02-.78a7.7 7.7 0 002.77 1.6l.3 2.14a.6.6 0 00.6.51h3.26a.6.6 0 00.6-.51l.3-2.14a7.7 7.7 0 002.77-1.6l2.02.78a.6.6 0 00.73-.26l1.63-2.82a.6.6 0 00-.15-.77z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
    <button class="iconbtn hide" id="btnShare" data-act="share">

function alpha(list){

/* Saves wherever it can: Claude storage first, the browser's own store second. */
const LS=(()=>{try{const k="__t";localStorage.setItem(k,"1");localStorage.removeItem(k);return localStorage;}catch(e){return null;}})();
async function readStore(){
  try{const r=await window.storage.get(KEY); if(r&&r.value) return r.value;}catch(e){}
  try{if(LS){const v=LS.getItem(KEY); if(v) return v;}}catch(e){}
  return null;
}
async function writeStore(str){
  let ok=false;
  try{await window.storage.set(KEY,str); ok=true;}catch(e){}
  try{if(LS){LS.setItem(KEY,str); ok=true;}}catch(e){}
  return ok;
}
async function load(){
  const raw=await readStore();
  if(!raw)return;
  try{const p=JSON.parse(raw);
    S=Object.assign(JSON.parse(JSON.stringify(DEF)),p);
    S.set=Object.assign({},DEF.set,p.set||{});}catch(e){}
}
let tmr=null;
function save(){clearTimeout(tmr);tmr=setTimeout(async()=>{
  const ok=await writeStore(JSON.stringify(S));
  if(!ok&&!memOnly){memOnly=true;toast(t("sessionOnly"));}
  /* Low-churn settings/overrides ride along on every save rather than
     needing a syncPatchMeta() call at each of their many mutation sites —
     cheap to re-push a small blob, much safer than hunting down every
     call site. Per-item state (list/todos/homeTasks/homeOneoff) is synced
     separately, right where each item actually changes — see CLAUDE.md. */
  syncPatchMeta("shopping",{hidden:S.hidden,hideCats:S.hideCats,newCats:S.newCats,catNames:S.catNames,
    route:S.route,rename:S.rename,recat:S.recat,stores:S.stores,cycles:S.cycles,lastDone:S.lastDone,
    defUnit:S.defUnit,defNote:S.defNote,custom:S.custom,lists:S.lists});

/* ---- receipt photos live in IndexedDB, not the JSON blob above ----
   localStorage has a ~5-10MB ceiling and base64 inflates size ~33%; a few
   dozen receipt photos would hit that ceiling. S.receipts keeps only
   {id, ts, store, total, hasImg} — the pixels live here instead. */
const IDB_NAME="laiki-media", IDB_STORE="receipts";
function idbOpen(){
  return new Promise((resolve,reject)=>{
    if(!window.indexedDB){reject(new Error("no indexeddb"));return;}
    const req=indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded=()=>{req.result.createObjectStore(IDB_STORE);};
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function idbSetImage(id,dataUri){
  try{
    const db=await idbOpen();
    await new Promise((res,rej)=>{
      const tx=db.transaction(IDB_STORE,"readwrite");
      tx.objectStore(IDB_STORE).put(dataUri,id);
      tx.oncomplete=res; tx.onerror=()=>rej(tx.error);
    });
  }catch(e){}
}
async function idbGetImage(id){
  try{
    const db=await idbOpen();
    return await new Promise((res,rej)=>{
      const tx=db.transaction(IDB_STORE,"readonly");
      const req=tx.objectStore(IDB_STORE).get(id);
      req.onsuccess=()=>res(req.result||null);
      req.onerror=()=>rej(req.error);
    });
  }catch(e){return null;}
}
async function idbDeleteImage(id){
  try{
    const db=await idbOpen();
    await new Promise((res,rej)=>{
      const tx=db.transaction(IDB_STORE,"readwrite");
      tx.objectStore(IDB_STORE).delete(id);
      tx.oncomplete=res; tx.onerror=()=>rej(tx.error);
    });
  }catch(e){}
}
function hydrateReceiptImages(){
  document.querySelectorAll("img[data-img]").forEach(el=>{
    const id=el.dataset.img;
    idbGetImage(id).then(uri=>{if(uri)el.src=uri;});
  });
}
async function migrateReceiptImages(){
  let changed=false;
  for(const r of (S.receipts||[])){
    if(r.img&&!r.hasImg){
      await idbSetImage(r.id,r.img);
      delete r.img; r.hasImg=true; changed=true;
    }
  }
  if(changed)save();
}

const CYCLE_DAYS={wk:7,fn:14,mo:30};
function dueItems(){

/* ---- prices ---- */
function priceRec(id){return S.prices[id]||null;}     /* {store:{p,ts}} */
function bestPrice(id){
  const r=priceRec(id); if(!r)return null;
  let best=null;
  Object.entries(r).forEach(([st,v])=>{if(!best||v.p<best.p)best={p:v.p,store:st};});
  return best;
}
function setPrice(id,store,p){
  if(!store)store="—";
  S.prices[id]=S.prices[id]||{};
  S.prices[id][store]={p:p,ts:Date.now()};
  if(store!=="—"&&!S.stores.includes(store))S.stores.push(store);
}
function money(n){return "€"+(Math.round(n*100)/100).toFixed(2);}
function basketTotal(){
  let sum=0,known=0,unknown=0;
  Object.keys(S.list).forEach(id=>{
    const b=bestPrice(id);
    if(b){sum+=b.p*S.list[id].qty;known++;}else unknown++;
  });
  return {sum,known,unknown};
}
function spentIn(days){
  const cut=Date.now()-days*864e5;
  return (S.receipts||[]).filter(r=>r.ts>=cut).reduce((a,r)=>a+(r.total||0),0);
}
function comparisons(){
  const out=[];
  Object.entries(S.prices).forEach(([id,rec])=>{
    const st=Object.entries(rec).filter(([s])=>s!=="—");
    if(st.length<2)return;
    st.sort((a,b)=>a[1].p-b[1].p);
    const it=byId(id); if(!it)return;
    out.push({item:it,low:st[0],high:st[st.length-1],diff:st[st.length-1][1].p-st[0][1].p});
  });
  return out.sort((a,b)=>b.diff-a.diff);
}

/* ================= HOME UPKEEP (ported from the standalone Spitiko app) =================
   Field names here are all `home`-prefixed in S (homeTasks/homeCustom/homeRename/
   homeOneoff) to avoid colliding with the shopping-domain fields of the same
   un-prefixed name above. See CLAUDE.md "Data model". */
function allHomeTasks(){
  const out=TASKS.map(c=>({...c}));
  S.homeCustom.forEach(c=>out.push({...c,custom:true}));
  out.forEach(ta=>{const r=S.homeRename[ta.id]; if(r){ta.en=r.en||ta.en; ta.gr=r.gr||ta.gr;}});
  return out;
}
function homeTaskName(ta){return S.set.lang==="gr"?(ta.gr||ta.en):ta.en;}
function homeTaskState(id){return S.homeTasks[id]||(S.homeTasks[id]={});}
function roomName(id){const r=ROOMS.find(x=>x[0]===id);if(!r)return id;return S.set.lang==="gr"?r[2]:r[1];}

/* Deterministic 0..1 fraction from a string, used to stagger initial due
   dates so the whole catalogue doesn't land "overdue" on day one. */
function hashFrac(str){let h=0;for(let i=0;i<str.length;i++){h=(h*31+str.charCodeAt(i))>>>0;}return (h%1000)/1000;}
function seedHomeIfNeeded(ta,now){
  const st=homeTaskState(ta.id);
  if(st.lastDone==null){
    const freqMs=ta.freqDays*86400000;
    const due=now+freqMs*hashFrac(ta.id);
    st.lastDone=due-freqMs;
  }
}
function seedAllHome(){
  const now=Date.now();
  allHomeTasks().forEach(ta=>seedHomeIfNeeded(ta,now));
}
function nextActiveDue(due,activeMonths){
  if(!activeMonths||!activeMonths.length)return due;
  const d=new Date(due);
  for(let i=0;i<12;i++){
    if(activeMonths.includes(d.getMonth()+1))return d.getTime();
    d.setMonth(d.getMonth()+1,1); d.setHours(0,0,0,0);
  }
  return due;
}
function dueOfHome(ta){
  const st=homeTaskState(ta.id);
  const freq=st.customFreqDays||ta.freqDays;
  let due=st.lastDone+freq*86400000;
  if(st.snoozeUntil&&st.snoozeUntil>due)due=st.snoozeUntil;
  return nextActiveDue(due,ta.activeMonths);
}
function homeStatusOf(due,now){
  if(due<now)return "overdue";
  if(due-now<=14*86400000)return "upcoming";
  return "ok";
}
function visibleHomeTasks(){return allHomeTasks().filter(ta=>!homeTaskState(ta.id).hidden);}
function markHomeDone(id){
  const ta=allHomeTasks().find(x=>x.id===id); if(!ta)return;
  const st=homeTaskState(id);
  st.lastDone=Date.now(); st.snoozeUntil=null;
  syncSetItem("homeTasks",id,st);
  save();
  const freq=st.customFreqDays||ta.freqDays;
  toast(t("doneBtn")+" · "+freq+"d");
}
function snoozeHomeTask(id){
  const st=homeTaskState(id);
  st.snoozeUntil=Date.now()+7*86400000;
  syncSetItem("homeTasks",id,st);
  save(); toast(t("snooze"));
}

/* One-off/notes with a due date behave like a lightweight home task for
   display purposes — they show up in This weekend / Schedule whenever that
   date falls due/soon, right alongside the scheduled catalogue. A one-off
   with no due date only ever shows in the "Not scheduled" section. */
function oneoffWithDue(){return (S.homeOneoff||[]).filter(n=>!n.done&&n.due);}
function oneoffDueMs(n){return new Date(n.due+"T00:00:00").getTime();}
function dueCandidates(){
  const tasks=visibleHomeTasks().map(ta=>({kind:"task",ta,due:dueOfHome(ta)}));
  const notes=oneoffWithDue().map(n=>({kind:"note",n,due:oneoffDueMs(n)}));
  return tasks.concat(notes);
}
function homeItemMinutes(x){return x.kind==="task"?x.ta.estMinutes:(x.n.estMinutes||20);}
function weekendPicks(){
  const now=Date.now();
  const due=dueCandidates()
    .filter(x=>homeStatusOf(x.due,now)!=="ok")
    .sort((a,b)=>a.due-b.due);
  const budgetMs=S.set.weekendBudget;
  let used=0; const picked=[];
  for(const x of due){
    if(used>0 && used>=budgetMs)break;
    picked.push(x); used+=homeItemMinutes(x);
  }
  return {picked,used};
}

/* ================= VOICE ================= */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const NUMW={en:{a:1,an:1,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,
   twelve:12,dozen:12,couple:2,"a couple":2,few:3,half:1},
  gr:{ενα:1,"ένα":1,μια:1,"μία":1,δυο:2,"δύο":2,τρια:3,"τρία":3,τεσσερα:4,"τέσσερα":4,πεντε:5,"πέντε":5,
   εξι:6,"έξι":6,εφτα:7,"εφτά":7,επτα:7,οκτω:8,"οκτώ":8,οχτω:8,εννεα:9,"εννέα":9,δεκα:10,"δέκα":10}};
const STOPW=["and","also","some","of","please","need","want","get","buy","add","a","an","the",
  "i","we","me","my","us","to","for","let","lets","put","grab","pick","up","more","dont","forget",
  "και","λιγο","λίγο","θελω","θέλω","παρε","πάρε","προσθεσε","πρόσθεσε"];

function normalise(s){
  return String(s||"").toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^\p{L}\p{N}\s]/gu," ").replace(/\s+/g," ").trim();
}
function splitPhrases(txt){
  return String(txt||"").toLowerCase()
    .split(/,| and | plus | also |\s+κι?αι\s+|^και\s+|;|\n/u)
    .map(s=>s.trim()).filter(Boolean);
}
function numWord(w){
  const table=Object.assign({},NUMW.en,NUMW.gr);
  const n=parseInt(w,10);
  return (!isNaN(n)&&n>0&&n<1000)?n:(table[w]||null);
}
function parseQty(words){
  let qty=1, rest=words.slice();
  if(!rest.length)return {qty,rest};
  const v=numWord(rest[0]);
  if(v){qty=v;rest=rest.slice(1);}
  return {qty,rest};
}
/* score a phrase against the catalogue */
function findItem(phrase){
  const words=normalise(phrase).split(" ").filter(w=>w&&!STOPW.includes(w));
  if(!words.length)return null;
  const q=words.join(" ");
  let best=null;
  allItems().forEach(it=>{
    [it.en,it.gr].forEach(nm=>{
      if(!nm)return;
      const n=normalise(nm);
      let sc=0;
      if(n===q)sc=100;
      else if(n.startsWith(q)||q.startsWith(n))sc=80;
      else if(n.includes(q)||q.includes(n))sc=60;
      else{
        const nw=n.split(" ");
        const hit=words.filter(w=>nw.some(x=>x===w||(w.length>4&&x.startsWith(w.slice(0,Math.max(4,w.length-2))))));
        if(hit.length)sc=30+hit.length*10-Math.abs(nw.length-words.length);
      }
      if(sc>0&&(!best||sc>best.sc))best={it,sc};
    });
  });
  return best&&best.sc>=40?best.it:null;
}
function applyVoice(txt){
  const res=[];
  splitPhrases(txt).forEach(p=>{
    let words=normalise(p).split(" ").filter(Boolean);
    while(words.length&&STOPW.includes(words[0])&&!numWord(words[0]))words=words.slice(1);
    const {qty,rest}=parseQty(words);
    const clean=rest.filter(w=>!STOPW.includes(w));
    if(!clean.length)return;
    const it=findItem(clean.join(" "));
    if(it){
      for(let i=0;i<qty;i++)add(it.id,true);
      res.push({ok:true,name:nameOf(it).a,qty});
    }else{

  rec.interimResults=true; rec.continuous=false; rec.maxAlternatives=1;

  rec.onresult=e=>{

    for(let i=0;i<e.results.length;i++)txt+=e.results[i][0].transcript;
    if(O)O.innerHTML='<div class="vtxt">'+esc(txt)+'</div>';
    if(e.results[e.results.length-1].isFinal)finishVoice(txt);
  };
  rec.onerror=()=>{if(H)H.textContent=t("tryAgain");};
  rec.onend=()=>{};

function doImport(){
  const raw=(document.getElementById("imp_txt").value||"");
  let ok=0, miss=[];
  raw.split(/\n/).forEach(line=>{
    if(!line.trim())return;
    /* pull the price off the end first, so "1,29" survives comma decimals */
    const m=line.match(/(?:€\s*)?(\d+(?:[.,]\d{1,2})?)\s*€?\s*$/);
    if(!m)return;
    const price=parseFloat(m[1].replace(",","."));
    if(isNaN(price)||price<=0)return;
    const head=line.slice(0,m.index).replace(/[,;\t|]\s*$/,"");
    const parts=head.split(/[,;\t|]/).map(s=>s.trim()).filter(Boolean);
    if(!parts.length)return;
    const store=parts.length>=2?parts[parts.length-1]:"";
    const name=(parts.length>=2?parts.slice(0,-1):parts).join(" ");
    const it=findItem(name);
    if(it){setPrice(it.id,store,price);ok++;}
    else miss.push(name);
  });
  save();closeSheet();render();
  toast(ok?ok+" "+t("imported")+(miss.length?" · "+miss.length+" "+t("skipped"):"")
          :t("nothingImported"));
}

let pendingImg=null;
function handlePhoto(e){
  const f=e.target.files&&e.target.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const max=900, sc=Math.min(1,max/Math.max(im.width,im.height));
      const cv=document.createElement("canvas");
      cv.width=Math.round(im.width*sc); cv.height=Math.round(im.height*sc);
      cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
      pendingImg=cv.toDataURL("image/jpeg",0.6);
      const p=document.getElementById("imgprev");
      if(p)p.innerHTML='<img src="'+pendingImg+'">';
    };
    im.src=rd.result;
  };
  rd.readAsDataURL(f);
}

  const it=byId(id); if(!it)return;
  const nm=(document.getElementById("e_name").value||"").trim();
  const ot=(document.getElementById("e_other").value||"").trim();
  const cat=document.getElementById("e_cat").value;
  if(nm){
    S.rename=S.rename||{};
    S.rename[id]=S.set.lang==="gr"?{gr:nm,en:ot||nm}:{en:nm,gr:ot||nm};
  }
  if(cat&&cat!==it.cat){S.recat=S.recat||{};S.recat[id]=cat;}
  const u=document.getElementById("e_unit"), nt=document.getElementById("e_note");
  S.defUnit=S.defUnit||{}; S.defNote=S.defNote||{};
  if(u&&u.value)S.defUnit[id]=u.value; else delete S.defUnit[id];
  if(nt&&nt.value.trim())S.defNote[id]=nt.value.trim(); else delete S.defNote[id];
  savePriceInputs(id);
  save();closeSheet();reindex();render();setTimeout(bindDrag,0);toast(t("saved"));
}
function savePriceInputs(id){
  const sts=[...document.querySelectorAll(".ps_store")];
  const prs=[...document.querySelectorAll(".ps_price")];
  const fresh={};
  sts.forEach((s,i)=>{
    const store=(s.value||"").trim();
    const p=parseFloat(prs[i].value);
    if(!isNaN(p)&&p>0){fresh[store||"—"]={p,ts:Date.now()};
      if(store&&!S.stores.includes(store))S.stores.push(store);}
  });
  if(Object.keys(fresh).length)S.prices[id]=fresh; else delete S.prices[id];
}

function viewCat(){
  const f=filter.trim().toLowerCase();
  let html="",shown=0;
  // due now
  const due=dueItems();
  if(due.length&&!f){
    html+='<div class="grp">'+t("due")+'</div>';
    due.forEach(i=>{const n=nameOf(i);
      html+='<div class="row">'+dual(n.a,n.b)
        +'<button class="plus" data-act="add" data-id="'+i.id+'">+</button></div>';});
  }
  const extras={};
  allItems().filter(i=>i.custom).forEach(c=>{(extras[c.cat]=extras[c.cat]||[]).push(c);});
  const order=catOrder();
  order.forEach((cat,gi)=>{
    let items=allItems().filter(i=>i.cat===cat&&!i.custom);
    if(extras[cat]){items=items.concat(extras[cat]);delete extras[cat];}
    items=alpha(items);
    html+=catBlock(cat,items,gi,f);
    shown+=countVis(items,f);
  });
  Object.keys(extras).forEach((cat,i)=>{
    html+=catBlock(cat,extras[cat],order.length+i,f);
    shown+=countVis(extras[cat],f);
  });
  if(!shown){
    html='<div class="empty"><h3>'+t("nothingFound")+' "'+esc(filter)+'"</h3>'
      +'<p>'+t("addMine")+'</p><button class="big" data-act="newitem">+ '+esc(filter)+'</button></div>';
  }
  return html;
}
function countVis(items,f){return f?items.filter(i=>match(i,f)).length:items.length;}
function match(i,f){return (i.en+" "+(i.gr||"")).toLowerCase().includes(f);}
function catBlock(cat,items,gi,f){
  const vis=f?items.filter(i=>match(i,f)):items;
  if(!vis.length)return "";
  const open=f?true:!!S.open[cat];
  const cn=catName(cat);
  let h='<section class="cat '+(open?"open":"")+'">';
  h+='<button class="cathead" data-act="cat" data-id="'+esc(cat)+'"><span class="idx">'+String(gi+1).padStart(2,"0")+'</span>';
  h+='<h2>'+esc(cn.a)+(S.set.dual&&cn.b?'<em>'+esc(cn.b)+'</em>':'')+'</h2>';
  h+='<span class="n">'+vis.length+'</span>';
  h+='<svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 5l7 7-7 7"/></svg></button><div class="items">';
  vis.forEach(i=>{
    const q=S.list[i.id]?S.list[i.id].qty:0;const n=nameOf(i);
    const b=S.set.showPrices?bestPrice(i.id):null;
    h+='<div class="row">'+dual(n.a,n.b+(b?(n.b?"  ":"")+money(b.p):""));
    if(q)h+='<button class="minus sm" data-act="dec" data-id="'+i.id+'">−</button>'
          +'<span class="qty">'+q+'</span>';
    h+='<button class="plus'+(q?" hot":"")+'" data-act="add" data-id="'+i.id+'">+</button></div>';
  });
  return h+'</div></section>';
}

function fmtHomeDue(due){
  const now=Date.now();
  const d=Math.round((due-now)/86400000);
  if(d===0)return t("today");
  if(d>0)return t("dueIn")+" "+d+" "+t("days");
  return Math.abs(d)+" "+t("daysAgo");
}
function homeStatusBadge(due){
  const s=homeStatusOf(due,Date.now());

function genCode(){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const arr=new Uint32Array(8);
  (window.crypto||window.msCrypto).getRandomValues(arr);
  let out=""; for(let i=0;i<8;i++)out+=chars[arr[i]%chars.length];
  return out;
}
async function fbInit(){

/* Last-write-wins per item, using each doc's own `updatedAt` — this is what
   lets two phones edit *different* items without clobbering each other; the
   same item edited on both phones within the same instant just picks
   whichever write reaches Firestore's server clock last, which is an
   acceptable, simple resolution for a 2-person household. */
function mergeMapDoc(id,data,localObj){
  const cur=localObj[id];
  if(!cur || (data.updatedAt||0) >= (cur.updatedAt||0)){ localObj[id]=data; return true; }
  return false;
}
function mergeArrayDoc(id,data,arr){
  const i=arr.findIndex(x=>x.id===id);
  if(i<0){ arr.push({...data,id}); return true; }
  if((data.updatedAt||0) >= (arr[i].updatedAt||0)){ arr[i]=Object.assign({},data,{id}); return true; }
  return false;
}
async function attachSync(){
  fbUnsubs.forEach(u=>{try{u();}catch(e){}}); fbUnsubs=[];
  if(!S.householdCode)return;
  if(!(await fbInit()))return;
  const {doc,collection,onSnapshot}=await import(FS_URL);
  const col=name=>collection(fbDb,"households",S.householdCode,name);
  const mdoc=name=>doc(fbDb,"households",S.householdCode,"meta",name);
  const onErr=label=>e=>toast("Sync ("+label+"): "+(e&&e.message?e.message:e));

  fbUnsubs.push(onSnapshot(col("list"),snap=>{
    let changed=false;
    snap.docChanges().forEach(ch=>{
      if(ch.type==="removed"){ if(S.list[ch.doc.id]){delete S.list[ch.doc.id];changed=true;} return; }
      if(mergeMapDoc(ch.doc.id,ch.doc.data(),S.list))changed=true;
    });
    if(changed){save();render();}
  },onErr("list")));
  fbUnsubs.push(onSnapshot(col("homeTasks"),snap=>{
    let changed=false;
    snap.docChanges().forEach(ch=>{
      if(ch.type==="removed")return;
      if(mergeMapDoc(ch.doc.id,ch.doc.data(),S.homeTasks))changed=true;
    });
    if(changed){save();render();}
  },onErr("homeTasks")));
  fbUnsubs.push(onSnapshot(col("todos"),snap=>{
    let changed=false; S.todos=S.todos||[];
    snap.docChanges().forEach(ch=>{
      if(ch.type==="removed"){ const before=S.todos.length; S.todos=S.todos.filter(x=>x.id!==ch.doc.id); if(S.todos.length!==before)changed=true; return; }
      if(mergeArrayDoc(ch.doc.id,ch.doc.data(),S.todos))changed=true;
    });
    if(changed){save();render();}
  },onErr("todos")));
  fbUnsubs.push(onSnapshot(col("homeOneoff"),snap=>{
    let changed=false; S.homeOneoff=S.homeOneoff||[];
    snap.docChanges().forEach(ch=>{
      if(ch.type==="removed"){ const before=S.homeOneoff.length; S.homeOneoff=S.homeOneoff.filter(x=>x.id!==ch.doc.id); if(S.homeOneoff.length!==before)changed=true; return; }
      if(mergeArrayDoc(ch.doc.id,ch.doc.data(),S.homeOneoff))changed=true;
    });
    if(changed){save();render();}
  },onErr("homeOneoff")));
  fbUnsubs.push(onSnapshot(mdoc("shopping"),snap=>{
    if(!snap.exists())return;
    const d=snap.data();
    ["hidden","hideCats","newCats","catNames","route","rename","recat","stores","cycles","lastDone",
     "defUnit","defNote","custom","lists"]
      .forEach(k=>{ if(d[k]!==undefined)S[k]=d[k]; });
    save();render();
  },onErr("meta/shopping")));
  fbUnsubs.push(onSnapshot(mdoc("home"),snap=>{
    if(!snap.exists())return;
    const d=snap.data();
    if(d.homeCustom!==undefined)S.homeCustom=d.homeCustom;
    if(d.homeRename!==undefined)S.homeRename=d.homeRename;
    save();render();
  },onErr("meta/home")));
  if(S.set.notifications)registerPushToken();
}
async function registerPushToken(){
  if(!FIREBASE_CONFIG||!VAPID_KEY||!S.householdCode)return;
  try{
    if(!("Notification" in window))return;
    const perm=await Notification.requestPermission();
    if(perm!=="granted")return;
    if(!(await fbInit()))return;
    const {getMessaging,getToken}=await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging.js");
    const reg=await navigator.serviceWorker.register("firebase-messaging-sw.js");
    const messaging=getMessaging(fbApp);
    const token=await getToken(messaging,{vapidKey:VAPID_KEY,serviceWorkerRegistration:reg});
    if(token){
      const {doc,setDoc,arrayUnion}=await import(FS_URL);
      await setDoc(doc(fbDb,"households",S.householdCode),{fcmTokens:arrayUnion({token,lang:S.set.lang})},{merge:true});
    }
  }catch(e){}
}

function saveItemSheet(id){
  const e=S.list[id];if(!e)return;
  const q=parseInt((document.getElementById("f_qty")||{}).value,10);
  e.qty=isNaN(q)||q<1?1:q;
  const u=document.getElementById("f_unit");if(u)e.unit=u.value;
  const n=document.getElementById("f_note");if(n)e.note=n.value.trim();
  const c=document.getElementById("f_cycle");
  if(c){S.cycles=S.cycles||{};if(c.value)S.cycles[id]=c.value;else delete S.cycles[id];}
  save();syncSetItem("list",id,e);closeSheet();render();
}
function saveNewItem(){
  const nm=(document.getElementById("f_name").value||"").trim();
  if(!nm){toast(t("itemName"));return;}
  let cat=document.getElementById("f_cat").value;
  if(cat==="__extra"){cat="My extras";}
  const nm2=((document.getElementById("f_name2")||{}).value||"").trim();
  const id="custom-"+Date.now().toString(36);
  const en=S.set.lang==="gr"?(nm2||nm):nm;
  const gr=S.set.lang==="gr"?nm:(nm2||nm);
  S.custom.push({id,en,gr,cat});
  S.list[id]={qty:1,done:false,note:"",unit:"",cycle:""};
  const q=parseInt((document.getElementById("f_qty")||{}).value,10);
  if(!isNaN(q)&&q>0)S.list[id].qty=q;
  const u=document.getElementById("f_unit");if(u)S.list[id].unit=u.value;
  const n=document.getElementById("f_note");if(n)S.list[id].note=n.value.trim();
  S.counts[id]=1; S.open[cat]=true;
  if(editing&&editing.type==="route"){delete S.list[id];delete S.counts[id];editing.preCat=null;editing.open=cat;}
  else{filter=""; searchOn=false; syncSetItem("list",id,S.list[id]);}
  save();closeSheet();render();
  if(editing&&editing.type==="route")setTimeout(bindDrag,0);
  toast(nm+" "+t("added"));
}
function togglePick(itemId){
  const lid=editing.id;const l=listById(lid);if(!l)return;
  if(!S.lists[lid])S.lists[lid]={name:l.name,desc:l.desc,items:l.items.slice()};
  const arr=S.lists[lid].items;
  const i=arr.indexOf(itemId);
  if(i>=0)arr.splice(i,1);else arr.push(itemId);
  save();render();
}
function saveListName(lid){

/* ---- drag to reorder (blocks can be different heights) ---- */
function bindDrag(){
  const box=document.getElementById("reorder");if(!box)return;
  if(box._bound)return; box._bound=true;
  box.style.touchAction="pan-y";
  let drag=null;
  box.addEventListener("pointerdown",e=>{
    if(!e.target.closest(".hnd"))return;
    const block=e.target.closest(".cblock");if(!block)return;
    const blocks=[...box.children];
    const tops=blocks.map(b=>b.offsetTop), hs=blocks.map(b=>b.offsetHeight);
    const from=blocks.indexOf(block);
    drag={block,blocks,tops,hs,from,to:from,start:e.clientY,h:hs[from],live:false};
    block.classList.add("drag");
    try{block.setPointerCapture(e.pointerId);}catch(_){}
  });
  box.addEventListener("pointermove",e=>{
    if(!drag)return;
    const d=e.clientY-drag.start;
    if(!drag.live){ if(Math.abs(d)<4) return; drag.live=true; }
    if(e.cancelable)e.preventDefault();
    drag.block.style.transform="translateY("+d+"px)";
    const centre=drag.tops[drag.from]+drag.h/2+d;
    let to=0;
    drag.blocks.forEach((b,i)=>{
      if(i===drag.from)return;
      if(drag.tops[i]+drag.hs[i]/2 < centre) to++;
    });
    if(to!==drag.to){
      drag.to=to;
      drag.blocks.forEach((b,i)=>{
        if(i===drag.from)return;
        let s=0;
        if(drag.from<to&&i>drag.from&&i<=to)s=-drag.h;
        if(drag.from>to&&i>=to&&i<drag.from)s=drag.h;
        b.style.transform=s?"translateY("+s+"px)":"";
      });
    }
  });
  const end=()=>{
    if(!drag)return;
    const order=catOrder();
    const moved=order.splice(drag.from,1)[0];
    order.splice(drag.to,0,moved);
    S.route=order;
    drag.blocks.forEach(b=>{b.style.transform="";b.classList.remove("drag");});
    drag=null;save();render();setTimeout(bindDrag,0);
  };
  box.addEventListener("pointerup",end);
  box.addEventListener("pointercancel",end);
}
