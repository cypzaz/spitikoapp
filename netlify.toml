# No `publish` key here: with it unset, Netlify publishes from the repo
# root by default, which is correct for this zero-build static app.
# Explicitly setting `publish = "."` broke the standalone Spitiko site's
# first deploy (see that app's CLAUDE.md "Known gaps") — omitting the key
# avoids that entirely. If this ever needs to be explicit again, try
# `publish = "/"` rather than `"."`, and double-check the Netlify
# dashboard's own Build settings → Publish directory field isn't
# overriding it with a stray value.
[build]
  functions = "netlify/functions"

[functions."weekly-digest"]
  schedule = "0 16 * * 5"
  # Fridays at 16:00 UTC = 18:00/19:00 Cyprus time (EEST/EET) — evening, before the weekend.
